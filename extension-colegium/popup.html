<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <style>
    body { font: 14px system-ui, sans-serif; width: 360px; margin: 0; padding: 14px; color: #141414; }
    h1 { font-size: 16px; margin: 0 0 4px; }
    p { margin: 0 0 10px; color: #555; }
    dl { display: grid; grid-template-columns: auto 1fr; gap: 4px 12px; margin: 0 0 12px; }
    dt { color: #555; } dd { margin: 0; font-weight: 600; }
    .ok { color: #2e7d4f; } .mal { color: #c4453a; }
    .botones { display: flex; gap: 8px; margin-bottom: 8px; }
    button { flex: 1; padding: 9px; border: 0; border-radius: 8px; font-weight: 600; cursor: pointer; background: #141414; color: #fff; }
    button.secundario { background: #eee; color: #141414; }
    details { margin-top: 10px; border-top: 1px solid #eee; padding-top: 8px; }
    summary { cursor: pointer; color: #555; }
    #estado { font-size: 13px; margin-top: 6px; }
  </style>
</head>
<body>
  <h1>Colegium → Panel</h1>
  <p>Con una pestaña de Colegium abierta se actualiza sola cada 30 minutos. Cada sección se aprende la primera vez que entrás a ella.</p>
  <dl id="resumen"></dl>
  <div id="envio"></div>
  <div class="botones">
    <button id="enviar">Enviar ahora</button>
    <button id="configurar" class="secundario">Configurar</button>
  </div>
  <details>
    <summary>Diagnóstico</summary>
    <p>Lo que recibió la página (para ajustar la extensión si Colegium cambia).</p>
    <div class="botones">
      <button id="copiar" class="secundario">Copiar diagnóstico</button>
      <button id="borrar" class="secundario">Borrar</button>
    </div>
  </details>
  <div id="estado" role="status"></div>
  <script src="popup.js"></script>
</body>
</html>
