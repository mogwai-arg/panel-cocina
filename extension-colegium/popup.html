<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <style>
    body { font: 14px system-ui, sans-serif; width: 380px; margin: 0; padding: 14px; color: #141414; }
    h1 { font-size: 16px; margin: 0 0 6px; }
    p { margin: 0 0 10px; color: #555; }
    ul { list-style: none; margin: 0 0 12px; padding: 0; max-height: 300px; overflow: auto; border: 1px solid #ddd; border-radius: 8px; }
    li { padding: 6px 8px; border-bottom: 1px solid #eee; font: 12px ui-monospace, Menlo, monospace; word-break: break-all; }
    li:last-child { border-bottom: 0; }
    .botones { display: flex; gap: 8px; }
    button { flex: 1; padding: 10px; border: 0; border-radius: 8px; font-weight: 600; cursor: pointer; background: #141414; color: #fff; }
    button.secundario { background: #eee; color: #141414; }
    #estado { margin-top: 8px; font-size: 13px; }
  </style>
</head>
<body>
  <h1>Colegium → Panel (diagnóstico)</h1>
  <p>Recorré en Colegium las secciones que te interesan. Acá se anota qué datos recibió la página.</p>
  <ul id="lista"></ul>
  <div class="botones">
    <button id="copiar">Copiar diagnóstico</button>
    <button id="borrar" class="secundario">Borrar</button>
  </div>
  <div id="estado"></div>
  <script src="popup.js"></script>
</body>
</html>
