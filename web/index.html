<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Panel de Cocina</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;1,6..72,400&family=Archivo:wdth,wght@62..125,600;62..125,800&family=Figtree:wght@400;500;600&family=Montserrat:wght@500;600&display=swap">
  <link rel="stylesheet" href="css/app.css">
  <link rel="stylesheet" href="css/fotos.css">
</head>
<body>
  <div class="pantalla" id="pantalla">
    <nav class="nav" aria-label="Secciones">
      <button data-ir="hoy">
        <svg viewBox="0 0 24 24"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/></svg>Hoy
      </button>
      <button data-ir="tareas">
        <svg viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="3"/><path d="M8 12l3 3 5-6"/></svg>Tareas
        <span class="nav__num" data-num="tareas" hidden></span>
      </button>
      <button data-ir="compras">
        <svg viewBox="0 0 24 24"><path d="M3 4h2l2.5 11h11L21 7H6.5"/><circle cx="9" cy="19.5" r="1.4"/><circle cx="17" cy="19.5" r="1.4"/></svg>Compras
        <span class="nav__num" data-num="compras" hidden></span>
      </button>
      <button data-ir="cole">
        <svg viewBox="0 0 24 24"><path d="M3 9l9-5 9 5-9 5z"/><path d="M7 11.5V16c0 1.5 2.2 3 5 3s5-1.5 5-3v-4.5"/><path d="M21 9v5"/></svg>Cole
        <span class="nav__num" data-num="cole" hidden></span>
      </button>
      <button data-ir="avisos">
        <svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3.5 6.5l8.5 6.5 8.5-6.5"/></svg>Avisos
        <span class="nav__num" data-num="avisos" hidden></span>
      </button>
      <button data-ir="fotos">
        <svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><circle cx="9" cy="10" r="1.8"/><path d="M4 18l6-5 4 3 3-2 4 3"/></svg>Fotos
      </button>
      <button class="nav__reloj" id="reloj-lateral" aria-label="Ajustes"></button>
    </nav>

    <div class="aviso-config" id="aviso-config" hidden></div>

    <section class="vista hoy" id="vista-hoy" data-vista-panel="hoy" aria-label="Hoy"></section>

    <section class="vista tareas" id="vista-tareas" data-vista-panel="tareas" aria-label="Tareas" hidden></section>
    <section class="vista compras" id="vista-compras" data-vista-panel="compras" aria-label="Compras" hidden></section>

    <section class="vista cole" id="vista-cole" data-vista-panel="cole" aria-label="Cole" hidden></section>
    <section class="vista cole avisos" id="vista-avisos" data-vista-panel="avisos" aria-label="Avisos" hidden></section>

    <div class="ajustes" id="ajustes" hidden>
      <b class="ajustes__titulo">Ajustes</b>
      <label class="interruptor"><input type="checkbox" data-ajuste="alternar"><span></span>
        <div>Mostrar el panel cada tanto<small data-r="alternar-detalle"></small></div></label>
      <label class="interruptor"><input type="checkbox" data-ajuste="noche"><span></span>
        <div>Descanso nocturno<small data-r="noche-detalle"></small></div></label>
      <button class="ajustes__cerrar" data-r="cerrar">Listo</button>
    </div>
    <div class="descanso" id="descanso" hidden></div>

    <div class="aviso" id="aviso" role="status" hidden><span id="aviso-texto"></span><button id="aviso-deshacer" hidden>↺ DESHACER</button></div>

    <section class="vista vista--fotos" id="vista-fotos" data-vista-panel="fotos" aria-label="Fotos" hidden>
      <main class="fotos" id="fotos"></main>
    </section>
  </div>

  <!-- config.js es opcional: si no existe, se usa el modo demo. -->
  <script>
    // Si config.js tiene un error de escritura, se anota para mostrarlo en pantalla.
    window.addEventListener('error', function (e) {
      if (e.filename && /config\.js/.test(e.filename)) window.ERROR_CONFIG = e.message + ' (línea ' + e.lineno + ')';
    });
  </script>
  <script src="config.js" onerror="window.CONFIG = null"></script>
  <script src="js/layout.js"></script>
  <script src="js/agenda.js"></script>
  <script src="js/clima.js"></script>
  <script src="js/basquet.js"></script>
  <script src="js/listas.js"></script>
  <script src="js/cole.js"></script>
  <script src="js/classroom.js"></script>
  <script src="js/mails.js"></script>
  <script src="js/ubicacion.js"></script>
  <script src="js/descanso.js"></script>
  <script src="js/fuentes.js"></script>
  <script src="js/fotos.js"></script>
  <script src="js/hoy.js"></script>
  <script src="js/vistas-listas.js"></script>
  <script src="js/vista-cole.js"></script>
  <script src="js/vista-avisos.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
